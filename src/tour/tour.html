<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tour pela FACOMP</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" async></script>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-cursor-teleport@1.6.0/dist/aframe-cursor-teleport-component.min.js"></script>
  </head>
  <body>
          
      <a-scene>
        <a-assets>
          <a-asset-item id="modelo-01" src="/src/assests/modelo_3d.glb"></a-asset-item>
          <img id="sky" src="https://cdn.glitch.global/06c1d76d-58c5-4cf9-b713-5c10b112f3d9/ceu2?v=1743032949566">
        </a-assets>


        <!-- Player -->
        <a-entity id="cameraRig" position="3 0 12" cursor-teleport="cameraRig: #cameraRig; cameraHead: #head; collisionEntities: .collision">
          <a-entity id="head" position="0 1.3 0" camera look-controls="reverseMouseDrag: true"></a-entity>         
        </a-entity>
        
        <a-entity class="collision" gltf-model="#modelo-01" scale="0.5 0.5 0.5" rotation="0 0 0"></a-entity>

        <a-sky src="#skyi"></a-sky>

      </a-scene>
  </body>
</html>
