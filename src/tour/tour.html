<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Tour virtual interativo pela Faculdade de Computação da UFPA Campus Castanhal" />
    <meta property="og:title" content="Tour Virtual FACOMP - UFPA Castanhal" />
    <meta property="og:description" content="Explore virtualmente a Faculdade de Computação com realidade virtual" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#2042ff" />
    <title>Tour Virtual FACOMP - Realidade Virtual</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preload" href="assets/modelo-3d-FACOMP.glb" as="fetch" crossorigin="anonymous" />
    <script src="script.js" defer></script>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-cursor-teleport@1.6.0/dist/aframe-cursor-teleport-component.min.js"></script>
  </head>


  <body>
    <!-- Loading Screen -->
    <div id="loader">
      <div class="loader-content">
        <div class="spinner"></div>
        <p>Carregando Tour Virtual...</p>
      </div>
    </div>

    <a-scene embedded style="height: 100vh; width: 100vw;" vr-mode-ui="enabled: true" loading-screen="enabled: false">

      <a-assets>
        <a-asset-item id="modelo-01" src="assets/modelo-3d-FACOMP.glb"></a-asset-item>
        <img id="sky" src="https://cdn.glitch.global/06c1d76d-58c5-4cf9-b713-5c10b112f3d9/ceu2?v=1743032949566">
      </a-assets>

      <div id="aviso-prototipo">
        Esta Aplicação é um protótipo e não representa o resultado final.
      </div>

      <a-entity id="cameraRig" position="5.5 1 15" cursor-teleport="cameraRig: #cameraRig; cameraHead: #head; collisionEntities: .collision">
        <a-entity id="head" position="0 1.5 0" camera look-controls="reverseMouseDrag: true" wasd-controls="acceleration: 20">
          <a-cursor 
            position="0 0 -1" 
            geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03" 
            material="color: white; shader: flat"
            animation__click="property: scale; startEvents: click; from: 0.1 0.1 0.1; to: 1 1 1; dur: 150"
            raycaster="objects: .clickable">
          </a-cursor>
        </a-entity>         
      </a-entity>
        
      <a-sky src="#sky" alt="Céu do ambiente virtual"></a-sky>

      <a-entity 
        class="collision clickable" 
        gltf-model="#modelo-01" 
        scale="0.2 0.2 0.2" 
        rotation="0 180 0" 
        position="1 1 1"
        shadow="cast: true; receive: true">
      </a-entity>

      <a-light type="ambient" color="#404040" intensity="0.4"></a-light>
      <a-light type="directional" position="0 10 5" color="#ffffff" intensity="0.6" shadow="cast: true"></a-light>

    </a-scene>
    
  </body>
</html>
